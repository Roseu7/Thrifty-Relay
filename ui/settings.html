<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ThriftyRelay settings</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 20px; color: CanvasText; background: Canvas; }
      main { max-width: 680px; margin: 0 auto; }
      h1 { margin: 0 0 12px; font-size: 1.35rem; }
      #status { min-height: 1.4em; margin: 0 0 16px; }
      #settings { display: grid; gap: 12px; }
      .setting { display: grid; gap: 5px; }
      .setting label { font-weight: 650; }
      .setting select { box-sizing: border-box; width: 100%; min-height: 40px; padding: 7px 10px; }
      .detail { font-size: 0.9rem; opacity: 0.82; }
      button { min-height: 40px; margin-top: 16px; padding: 8px 16px; font: inherit; }
      .notes { padding-inline-start: 20px; font-size: 0.9rem; line-height: 1.45; }
      .notes li + li { margin-top: 5px; }
      :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">ThriftyRelay — Settings</h1>
      <p id="status" role="status" aria-live="polite">Waiting for the settings app host…</p>
      <form id="settings" aria-label="ThriftyRelay settings"></form>
      <button id="save" type="button" disabled>Save settings</button>
      <ul id="notes" class="notes"></ul>
    </main>
    <script id="settings-app-bundle"></script>
  </body>
</html>
